name: CI

# Run on every push and pull request. The publish job below is additionally
# gated so it only runs for version tags (e.g. v0.1.0).
on: [push, pull_request]

# If you push twice quickly, cancel the older run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Runs the exact same hooks as local development (ruff, ruff-format, mypy,
      # trailing-whitespace, ...) using the versions pinned in .pre-commit-config.yaml,
      # so CI and your machine can never disagree.
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]        # only build if quality gates pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build   # produces dist/*.whl and dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # CD: publish to PyPI when a version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
  #
  # Before this works you must EITHER:
  #   - configure a PyPI "Trusted Publisher" for this repo (recommended — no secrets), OR
  #   - remove the `id-token` permission and pass a token:
  #       with: { password: ${{ secrets.PYPI_API_TOKEN }} }
  # Note: the distribution name is `kvstore` (see pyproject.toml); pick a name that is
  # still available on PyPI, or publish to TestPyPI first.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write          # enables PyPI Trusted Publishing (OIDC), no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
